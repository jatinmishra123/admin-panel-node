<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Category</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      background-color: #051b31;
      overflow-x: hidden;
    }

    /* Header Space */
    #header {
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1050;
    }

    /* Sidebar */
    #sidebarWrap {
      width: 260px;
      position: fixed;
      top: 70px;
      left: 0;
      height: calc(100vh - 70px);
      overflow-y: auto;
      z-index: 1000;
      background: #857e7e;
      border-right: 1px solid #316ba5;
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      margin-top: 90px;
      padding: 30px;
      min-height: 100vh;
    }

    .card {
      border-radius: 16px;
    }

    /* Mobile Responsive */
    @media (max-width: 991px) {
      #sidebarWrap {
        position: relative;
        width: 100%;
        height: auto;
        top: 0;
        border-right: none;
      }

      .main-content {
        margin-left: 0;
        margin-top: 20px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header"></div>

  <!-- Sidebar -->
  <div id="sidebarWrap"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="container-fluid">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <h2 class="h4 mb-4 text-center">Create New Category</h2>

              <form id="categoryForm" enctype="multipart/form-data" class="row g-3">

                <!-- Category Name -->
                <div class="col-12 text-black">
                  <label for="categoryName" class="form-label">Category Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="categoryName"
                    name="category_name"
                    placeholder="Enter category name"
                    required
                  />
                </div>

                <!-- Category Image -->
                <div class="col-12">
                  <label for="categoryImage" class="form-label">Category Image</label>
                  <input
                    type="file"
                    class="form-control"
                    id="categoryImage"
                    name="category_image"
                    accept="image/*"
                    required
                  />
                </div>

                <!-- Image Preview -->
                <div class="col-12 d-none" id="imagePreview">
                  <img
                    id="previewImg"
                    src=""
                    alt="Preview"
                    class="img-thumbnail"
                    style="max-width: 180px;"
                  />
                </div>

                <!-- Remark -->
                <div class="col-12">
                  <label for="remark" class="form-label text-black">Remark</label>
                  <textarea
                    class="form-control"
                    id="remark"
                    name="remark"
                    rows="4"
                    placeholder="Enter category remark..."
                  ></textarea>
                </div>

                <!-- Status -->
                <div class="col-12">
                  <label class="form-label d-block text-black">Status</label>

                  <div class="form-check form-check-inline text-black">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="status"
                      id="statusActive"
                      value="Active"
                      checked
                    />
                    <label class="form-check-label text-black" for="statusActive">
                      Active
                    </label>
                  </div>

                  <div class="form-check form-check-inline text-black">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="status"
                      id="statusInactive"
                      value="Inactive"
                    />
                    <label class="form-check-label" for="statusInactive">
                      Inactive
                    </label>
                  </div>
                </div>

                <!-- Submit -->
                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">
                    Save Category
                  </button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <script>
    // Load Header
    fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;
      });

    // Load Sidebar
    fetch("sidebar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("sidebarWrap").innerHTML = data;
      });

    // Load Footer
    fetch("footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      });

    // Image Preview
    document.getElementById("categoryImage").addEventListener("change", function (event) {
      const file = event.target.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        document.getElementById("previewImg").src = e.target.result;
        document.getElementById("imagePreview").classList.remove("d-none");
      };

      reader.readAsDataURL(file);
    });

    // Form Submit Demo
    document.getElementById("categoryForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Category Saved Successfully!");
    });
  </script>

</body>
</html>
