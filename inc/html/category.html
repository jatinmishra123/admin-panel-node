<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="admin panel professional admin dashboard template">
  <title>Add User | admin panel</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <div id="sidebarSlot"></div>

    <div class="admin-main">
      <div id="navbarSlot"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Management</p>
                <h1 class="h3 mb-1">Add Category</h1>
                <p class="text-muted mb-0">Create a new Category .</p>
              </div>
            </div>
            <div class="heading-actions"><a class="btn btn-outline-secondary btn-sm" href="/users"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to Dashboard</a></div>
          </div>

          <section class="row g-3">
            <div class="col-12 col-xl-8">
              <form class="panel needs-validation" novalidate id="categoryForm">
                <div class="panel-header"><div><h2 class="h5 mb-1 section-title"><i class="bi bi-person-plus" aria-hidden="true"></i><span>Category Information</span></h2><p class="text-muted mb-0">Create a category  with validated fields.</p></div></div>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label" for="categoryName">Cagtegory name:-</label><input class="form-control" id="CategoryName" type="text" placeholder="Enter the category..." required><div class="invalid-feedback">First name is required.</div></div>
                  <div class="col-md-6"><label class="form-label" for="categorytext">Category Text:-</label><input class="form-control" id="categorytext" type="text" placeholder="Enter the category  text..." required><div class="invalid-feedback">text name is required.</div></div>
                 <div class="col-md-6"><label class="form-label" for="file">Category image:-</label><input class="form-control" id="iamge" type="file"><div class="invalid-feedback"> image is required.</div></div>

                  <div class="col-md-6"><label class="form-label" for="type">Type:-</label><select class="form-select" id="type" required><option value="">Choose Type</option><option>Electronics</option><option>Fashion</option><option>Grocery</option><option>Beauty</option></select><div class="invalid-feedback">Choose a role.</div></div>
                  <div class="col-12"><label class="form-label" for="notes">Notes:-</label><textarea class="form-control" id="notes" rows="4" placeholder="Optional onboarding notes"></textarea></div>
                </div>
                <div class="d-flex flex-wrap justify-content-end gap-2 mt-4"><a class="btn btn-outline-secondary" href="/users">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-person-check" aria-hidden="true"></i> Create Category</button></div>
              </form>
            </div>
            <div class="col-12 col-xl-4">
              <div class="panel h-100">
                <h2 class="h5 mb-3 section-title"><i class="bi bi-list-check" aria-hidden="true"></i><span>Access All Category</span></h2>
                <div class="activity-list" id="categoryList">
                  <p class="text-muted small mb-0">Loading categories...</p>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <div id="footerSlot"></div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
  (function () {
    var listEl = document.getElementById("categoryList");
    var fallbackImage = "../assets/images/brand/logo/logo.png";

    function renderCategories(categories) {
      if (!listEl) return;

      if (!categories || !categories.length) {
        listEl.innerHTML = '<p class="text-muted small mb-0">No categories yet. Create one to see it here.</p>';
        return;
      }

      listEl.innerHTML = "";
      categories.forEach(function (category) {
        var item = document.createElement("div");
        item.className = "activity-item";
        item.innerHTML =
          '<img class="avatar-img avatar-sm" alt="">' +
          '<div class="d-flex align-items-center justify-content-between gap-2">' +
            '<div><p class="mb-1 fw-semibold"></p><p class="text-muted small mb-0"></p></div>' +
            '<div class="d-flex gap-1">' +
              '<button type="button" class="btn btn-light btn-sm edit-category-btn" title="Edit"><i class="bi bi-pencil" aria-hidden="true"></i></button>' +
              '<button type="button" class="btn btn-light btn-sm text-danger delete-category-btn" title="Delete"><i class="bi bi-trash" aria-hidden="true"></i></button>' +
            '</div>' +
          '</div>';
        item.querySelector("img").src = category.image || fallbackImage;
        item.querySelector("img").alt = category.name;
        item.querySelector(".fw-semibold").textContent = category.name;
        item.querySelector(".text-muted").textContent = category.text || category.type || "Category";
        item.querySelector(".edit-category-btn").addEventListener("click", function () {
          editCategory(category);
        });
        item.querySelector(".delete-category-btn").addEventListener("click", function () {
          deleteCategory(category._id, category.name);
        });
        listEl.appendChild(item);
      });
    }

    async function editCategory(category) {
      var updated = await window.editDialog({
        title: "Edit Category",
        fields: [
          { key: "name", label: "Category Name", type: "text", required: true },
          { key: "text", label: "Category Text", type: "text" },
          { key: "type", label: "Type", type: "select", options: ["Electronics", "Fashion", "Grocery", "Beauty"] },
          { key: "notes", label: "Notes", type: "textarea" },
          { key: "image", label: "Replace Image (optional)", type: "file" }
        ],
        values: { name: category.name, text: category.text, type: category.type, notes: category.notes }
      });

      if (!updated) return;

      var formData = new FormData();
      formData.append("name", updated.name);
      formData.append("text", updated.text);
      formData.append("type", updated.type);
      formData.append("notes", updated.notes);
      if (updated.image) formData.append("image", updated.image);

      try {
        var response = await window.authorizedFetch("/api/categories/" + category._id, {
          method: "PUT",
          body: formData
        });
        if (!response) return;
        var result = await response.json();

        if (result.success) {
          window.showToast(result.message || "Category updated.", "success");
          loadCategories();
        } else {
          window.showToast(result.message || "Failed to update category.", "error");
        }
      } catch (error) {
        console.error("Update category failed:", error);
        window.showToast("Something went wrong. Please try again.", "error");
      }
    }

    async function deleteCategory(id, name) {
      var confirmed = await window.confirmDialog('Delete category "' + name + '"? This cannot be undone.', { title: "Delete Category" });
      if (!confirmed) return;

      try {
        var response = await window.authorizedFetch("/api/categories/" + id, { method: "DELETE" });
        if (!response) return;
        var result = await response.json();

        if (result.success) {
          window.showToast(result.message || "Category deleted.", "success");
          loadCategories();
        } else {
          window.showToast(result.message || "Failed to delete category.", "error");
        }
      } catch (error) {
        console.error("Delete category failed:", error);
        window.showToast("Something went wrong. Please try again.", "error");
      }
    }

    async function loadCategories() {
      var response = await window.authorizedFetch("/api/categories");
      if (!response) return;
      var result = await response.json();
      if (result.success) renderCategories(result.data);
    }

    var form = document.getElementById("categoryForm");
    if (form) {
      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!form.checkValidity()) {
          return;
        }

        var formData = new FormData();
        formData.append("name", document.getElementById("CategoryName").value.trim());
        formData.append("text", document.getElementById("categorytext").value.trim());
        formData.append("type", document.getElementById("type").value);
        formData.append("notes", document.getElementById("notes").value.trim());

        var imageFile = document.getElementById("iamge").files[0];
        if (imageFile) formData.append("image", imageFile);

        try {
          var response = await window.authorizedFetch("/api/categories", {
            method: "POST",
            body: formData
          });
          if (!response) return;

          var result = await response.json();

          if (result.success) {
            window.showToast(result.message || "Category created.", "success");
            form.reset();
            form.classList.remove("was-validated");
            loadCategories();
          } else {
            window.showToast(result.message || "Failed to create category.", "error");
          }
        } catch (error) {
          console.error("Create category failed:", error);
          window.showToast("Something went wrong. Please try again.", "error");
        }
      });
    }

    loadCategories();
  })();
  </script>
</body>
</html>
