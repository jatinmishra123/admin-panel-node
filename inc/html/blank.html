<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="admin panel professional admin dashboard template">
  <title>Blank | admin panel</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <div id="sidebarSlot"></div>

    <div class="admin-main">
      <div id="navbarSlot"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-file-earmark" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Starter</p>
                <h1 class="h3 mb-1">Blank</h1>
                <p class="text-muted mb-0">A clean starter page for new admin screens.</p>
              </div>
            </div>
            
          </div>

          <section class="panel blank-panel">
            <div class="blank-state">
              <img class="blank-visual" src="../assets/images/png/dasher-ai.png" alt="admin panel assistant visual">
              <h2 class="h4 mb-2">Blank Page</h2>
              <p class="text-muted mb-4">Start a new admin screen from this clean, responsive page shell.</p>
              <a class="btn btn-primary" href="/components"><i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> Browse Components</a>
            </div>
          </section>
        </div>
      </main>

      <div id="footerSlot"></div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
