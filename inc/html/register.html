<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="admin panel authentication page">
  <title>Register | admin panel</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="register.html"><img class="avatar-img avatar-sm" src="../assets/images/brand/logo/logo.png" alt="Admin jatin "><span><strong>admin panel</strong><small>Create your admin panel account.</small></span></a>
      <div class="auth-visual"><img src="../assets/images/png/dasher-ui-bootstrap-5.jpg" alt="admin panel dashboard interface"></div>
      <form class="needs-validation" novalidate id="registerForm">
        <div class="mb-4">
          <p class="eyebrow mb-1">Secure Access</p>
          <h1 class="h3 mb-1">Register</h1>
          <p class="text-muted mb-0">Create your admin panel account.</p>
        </div>
        <div class="mb-3">
          <label class="form-label" for="registerName">Full name</label>
          <input class="form-control" id="registerName" type="text" placeholder="Enter the fiull name ..." required>
          <div class="invalid-feedback">Full name is required.</div></div>
        <div class="mb-3">
          <label class="form-label" for="registerEmail">Email address</label>
          <input class="form-control" id="registerEmail" type="email" placeholder="Enter the email..." required><div class="invalid-feedback">Enter a valid email.</div></div>
        <div class="mb-3"><label class="form-label" for="registerPassword">Password</label><input class="form-control" id="registerPassword" type="password" placeholder="Enter the password..." minlength="6" required><div class="invalid-feedback">Password must be at least 6 characters.</div></div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">I agree to the terms</label><div class="invalid-feedback">You must agree before continuing.</div></div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create Account</button>
      </form>
      
      <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
    </section>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
<script>
document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const name = document.getElementById("registerName").value;
    const email = document.getElementById("registerEmail").value;
    const password = document.getElementById("registerPassword").value;

    try {
        const response = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name,
                email,
                password
            })
        });

        const data = await response.json();

        if (data.success) {
            alert(data.message);

            // Redirect to login
            window.location.href = "/";
        } else {
            alert(data.message);
        }

    } catch (error) {
        alert("Something went wrong.");
        console.log(error);
    }
});
</script>
</html>
