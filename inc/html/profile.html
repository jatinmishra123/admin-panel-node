<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminHMD professional admin dashboard template">
  <title>Profile | adminHMD</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>
  <div class="admin-shell">
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <div id="sidebarSlot"></div>

    <div class="admin-main">
      <div id="navbarSlot"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-person-badge" aria-hidden="true"></i></span>
              <div>
                <p class="eyebrow mb-1">Account</p>
                <h1 class="h3 mb-1">Profile</h1>
                <p class="text-muted mb-0">Manage your personal details, bio, and contact preferences.</p>
              </div>
            </div>
            
          </div>

        <section class="row g-3">
  <div class="col-12 col-xl-4">
    <div class="panel h-100 text-center profile-card">

      <!-- Cover -->
      <div class="profile-cover">
        <img src="../assets/images/png/dasher-ui-bootstrap-5.jpg" alt="admin dashboard preview">
      </div>

      <!-- Profile Image -->
      <img class="avatar-img avatar-xl profile-photo"
           src="../assets/images/brand/logo/logo.png"
           alt="Profile Image">

      <!-- Dynamic Name -->
      <h2 class="h5 mt-3 mb-1" id="profileCardName">Loading...</h2>

      <!-- Dynamic Role -->
      <p class="text-muted mb-3" id="profileCardRole">User</p>

      <!-- Badges -->
      <div class="d-flex justify-content-center gap-2">
        <span class="badge text-bg-primary">Admin</span>
        <span class="badge text-bg-success">Verified</span>
      </div>

      <!-- Dynamic Info -->
      <div class="info-list mt-4 text-start">
        <div>
          <span>Email</span>
          <strong id="profileCardEmail">Loading...</strong>
        </div>

        <div>
          <span>Member Since</span>
          <strong id="profileMemberSince">Loading...</strong>
        </div>

        <div>
          <span>Account Type</span>
          <strong>Administrator</strong>
        </div>
      </div>

    </div>
  </div>

  <!-- Profile Form -->
  <div class="col-12 col-xl-8">
    <form class="panel needs-validation" id="profileForm" novalidate>

      <div class="panel-header">
        <div>
          <h2 class="h5 mb-1 section-title">
            <i class="bi bi-person-gear" aria-hidden="true"></i>
            <span>Profile Settings</span>
          </h2>
          <p class="text-muted mb-0">
            Update your account profile and contact details.
          </p>
        </div>
      </div>

      <div class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label" for="profileName">Name</label>
          <input class="form-control"
                 id="profileName"
                 type="text"
                 required>
          <div class="invalid-feedback">
            Name is required.
          </div>
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label" for="profileEmail">Email</label>
          <input class="form-control"
                 id="profileEmail"
                 type="email"
                 readonly>
          <div class="invalid-feedback">
            Enter a valid email.
          </div>
        </div>

        <!-- Bio -->
        <div class="col-12">
          <label class="form-label" for="profileBio">Bio</label>
          <textarea class="form-control"
                    id="profileBio"
                    rows="5"></textarea>
        </div>

      </div>

      <div class="d-flex justify-content-end mt-4">
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-check2-circle" aria-hidden="true"></i>
          Save Profile
        </button>
      </div>

    </form>
  </div>
</section>
        </div>
      </main>

      <div id="footerSlot"></div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
<script>

function formatDate(value) {
    const d = new Date(value);
    if (isNaN(d.getTime())) return "-";
    return d.toLocaleDateString("en-US", { month: "long", day: "2-digit", year: "numeric" });
}

async function loadProfile() {
    try {
        const response = await window.authorizedFetch("/api/profile");
        if (!response) return;

        const data = await response.json();

        if (!data.success) {
            window.showToast(data.message || "Failed to load profile.", "error");
            return;
        }

        const user = data.data;

        // Left Card
        document.getElementById("profileCardName").innerText = user.name || "No Name";
        document.getElementById("profileCardEmail").innerText = user.email || "No Email";
        document.getElementById("profileMemberSince").innerText = formatDate(user.createdAt);

        // Form
        document.getElementById("profileName").value = user.name || "";
        document.getElementById("profileEmail").value = user.email || "";
        document.getElementById("profileBio").value = user.bio || "";

    } catch (error) {
        console.log("Profile load failed:", error);
        window.showToast("Something went wrong loading your profile.", "error");
    }
}

// Profile Update
document.getElementById("profileForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
    }

    const name = document.getElementById("profileName").value.trim();
    const bio = document.getElementById("profileBio").value.trim();

    try {
        const response = await window.authorizedFetch("/api/profile", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, bio })
        });
        if (!response) return;

        const data = await response.json();

        if (data.success) {
            window.showToast(data.message || "Profile updated successfully.", "success");
            window.adminHMDUser = window.adminHMDUser || {};
            window.adminHMDUser.name = name;
            window.applyUserProfileUI(window.adminHMDUser);
            loadProfile();
        } else {
            window.showToast(data.message || "Update failed.", "error");
        }
    } catch (error) {
        console.error("Profile update failed:", error);
        window.showToast("Something went wrong. Please try again.", "error");
    }
});

// Initial Load
loadProfile();

function logout() {
    window.clearAuthToken();
    window.location.href = "/";
}
</script>
</html>
